[project]
name = "backend"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "XuChenXu", email = "91937041+ChenXu233@users.noreply.github.com"},
]
dependencies = [
    "fastapi>=0.124.2",
    "uvicorn>=0.38.0",
    "cryptography>=46.0.3",
    "aiohttp>=3.13.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[project.optional-dependencies]
dev = [
    "alembic>=1.17.2",
]
[tool.pdm]
distribution = false

[tool.pdm.scripts]
"dev" = "pdm run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
"start" = "pdm run uvicorn app.main:app --host 0.0.0.0 --port 8000"
"alembic-upgrade" = "alembic upgrade head"
"alembic-gen" = "alembic revision --autogenerate -m"